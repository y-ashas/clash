cd /workspaces/clash && cat > index.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clash - 3D Tower Defense</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; overflow: hidden; background: #000; }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 18px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 10;
    }
    .stat {
      margin: 10px 0;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      border-radius: 5px;
      border-left: 3px solid #4caf50;
    }
    .elixir-bar {
      width: 200px;
      height: 30px;
      background: rgba(0,0,0,0.5);
      border: 2px solid white;
      border-radius: 5px;
      margin-top: 10px;
      overflow: hidden;
    }
    #p1ElixirFill {
      height: 100%;
      background: linear-gradient(90deg, #4caf50, #45a049);
      width: 40%;
      transition: width 0.2s;
    }
    button {
      margin-top: 10px;
      padding: 10px 15px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
  <div id="ui">
    <div class="stat">
      <div>P1 Elixir: <span id="p1Elixir">4</span>/10</div>
      <div class="elixir-bar"><div id="p1ElixirFill"></div></div>
    </div>
    <div class="stat">
      <div>P2 Elixir: <span id="p2Elixir">4</span>/10</div>
    </div>
    <div class="stat">
      <div>Units: <span id="unitCount">0</span></div>
    </div>
    <button onclick="window.selectMode('bot')">Start vs Bot</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>
  <script>
    // Wait for THREE to be defined before using OrbitControls
    if (typeof THREE !== 'undefined' && !THREE.OrbitControls) {
      // Fallback: create a minimal OrbitControls-like object
      THREE.OrbitControls = function(camera, dom) {
        this.camera = camera;
        this.dom = dom;
        this.enableDamping = true;
        this.dampingFactor = 0.05;
        this.update = function() {};
      };
    }
  </script>

  <script>
let scene, camera, renderer, controls;
let lastTime = performance.now();
const MAX_ELIXIR = 10;
const ARENA = { width: 24, height: 36 };
const ARENA_HALF = { x: ARENA.width / 2, z: ARENA.height / 2 };

const STATE = { mode: null, started: false, gameOver: false, elapsed: 0, selectedLane: 0 };
const TROOP_BY_KEY = {
  knight: { key: 'knight', name: 'Knight', cost: 3, hp: 100, speed: 2.2 }
};
const GAME = { elixir: { P1: 4, P2: 4 }, hands: { P1: ['knight','knight'], P2: ['knight'] }, units: [], towers: [] };

function setupArena() {
  GAME.towers.forEach(t => { try { if (t.mesh) scene.remove(t.mesh); } catch (e){} });
  GAME.towers = [];

  const towerOffsetX = 6;
  const towerZPlayer = ARENA_HALF.z - 3;
  const towerZEnemy  = -ARENA_HALF.z + 3;

  function makeTower(owner, type, x, z) {
    const t = { id: (GAME.towers.length+1), owner, type, hp: type==='king'? 300 : 120, pos: new THREE.Vector3(x, 0, z), alive: true, mesh: null };
    const geo = new THREE.BoxGeometry(1.2, 2.2, 1.2);
    const mat = new THREE.MeshStandardMaterial({ color: owner==='P1'?0x4caf50:0xf44336 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, 1.1, z);
    scene.add(mesh);
    t.mesh = mesh;
    GAME.towers.push(t);
    return t;
  }

  makeTower('P2','princess', -towerOffsetX, towerZEnemy);
  makeTower('P2','princess',  towerOffsetX, towerZEnemy);
  makeTower('P2','king', 0, towerZEnemy - 3);

  makeTower('P1','princess', -towerOffsetX, towerZPlayer);
  makeTower('P1','princess',  towerOffsetX, towerZPlayer);
  makeTower('P1','king', 0, towerZPlayer + 3);
}

class Unit {
  constructor(troop, owner, laneIndex) {
    this.id = (Unit._nextId = (Unit._nextId || 0) + 1);
    this.troop = troop;
    this.owner = owner;
    this.hp = troop.hp;
    const spawnX = owner === 'P1' ? 4 : -4;
    const spawnZ = (laneIndex === 0 ? -2 : 2);
    this.pos = new THREE.Vector3(spawnX, 0.6, spawnZ);
    this.speed = troop.speed;
    this.target = null;
    this.mesh = this._makeMesh();
    if (scene) scene.add(this.mesh);
  }
  _makeMesh(){
    const g = new THREE.BoxGeometry(0.7, 1.2, 0.7);
    const m = new THREE.MeshStandardMaterial({ color: this.owner === 'P1' ? 0x88cc88 : 0xcc8888 });
    const mesh = new THREE.Mesh(g, m);
    mesh.position.copy(this.pos);
    return mesh;
  }
  alive(){ return this.hp > 0; }

  acquireTarget() {
    const enemies = GAME.towers.filter(t => t.alive && t.owner !== this.owner);
    if (enemies.length === 0) { this.target = null; return; }
    enemies.sort((a,b) => {
      const da = a.type === 'king' ? 0.5 : 1.0;
      const db = b.type === 'king' ? 0.5 : 1.0;
      const distA = this.pos.distanceTo(a.pos) / da;
      const distB = this.pos.distanceTo(b.pos) / db;
      return distA - distB;
    });
    this.target = enemies[0];
  }

  update(dt) {
    if (!this.target || !this.target.alive) this.acquireTarget();
    if (!this.target) {
      this._clampPosition();
      if (this.mesh) this.mesh.position.copy(this.pos);
      return;
    }

    const to = new THREE.Vector3(this.target.pos.x, 0, this.target.pos.z);
    const dir = to.clone().sub(new THREE.Vector3(this.pos.x, 0, this.pos.z));
    const dist = dir.length();
    if (dist > 0.05) {
      dir.normalize();
      const moveDist = Math.min(this.speed * dt, dist);
      this.pos.x += dir.x * moveDist;
      this.pos.z += dir.z * moveDist;
    }

    this._clampPosition();

    if (this.mesh) {
      this.mesh.position.x = this.pos.x;
      this.mesh.position.z = this.pos.z;
      this.mesh.position.y = 0.6 + 0.02 * Math.sin(performance.now() / 150 + this.id);
    }

    if (dist < 1.1 && this.target && this.target.alive) {
      const damage = 20 * dt;
      this.target.hp -= damage;
      if (this.target.mesh) {
        this.target.mesh.scale.y = 1 - Math.min(0.6, (this.target.hp / (this.target.type==='king'?300:120)));
      }
      if (this.target.hp <= 0) {
        this.target.alive = false;
        try { if (this.target.mesh) scene.remove(this.target.mesh); } catch (e){}
        GAME.towers = GAME.towers.map(t => t.id === this.target.id ? this.target : t);
        this.target = null;
      }
    }
  }

  _clampPosition() {
    const margin = 0.5;
    this.pos.x = Math.max(-ARENA_HALF.x + margin, Math.min(ARENA_HALF.x - margin, this.pos.x));
    this.pos.z = Math.max(-ARENA_HALF.z + margin, Math.min(ARENA_HALF.z - margin, this.pos.z));
  }

  destroy() {
    try { if (this.mesh) scene.remove(this.mesh); } catch(e){}
    this.hp = 0;
  }
}

function tickElixir(dt){
  ['P1','P2'].forEach(p => GAME.elixir[p] = Math.min(MAX_ELIXIR, GAME.elixir[p] + dt * 0.5));
}

function tickUnits(dt){
  for (let i = GAME.units.length - 1; i >= 0; i--) {
    const u = GAME.units[i];
    if (!u.alive()) { u.destroy(); GAME.units.splice(i,1); continue; }
    u.update(dt);
  }
}

function botProactive(dt){
  if (STATE.mode === 'bot' && Math.random() < 0.01) {
    const pick = TROOP_BY_KEY.knight;
    if (GAME.elixir.P2 >= pick.cost) {
      GAME.elixir.P2 -= pick.cost;
      const unit = new Unit(pick, 'P2', Math.random() < 0.5 ? 0 : 1);
      GAME.units.push(unit);
    }
  }
}

function updateUI(){
  const p1 = document.getElementById('p1ElixirFill');
  if (p1) p1.style.width = Math.round((GAME.elixir.P1 / MAX_ELIXIR) * 100) + '%';
  
  const p1Val = document.getElementById('p1Elixir');
  if (p1Val) p1Val.textContent = Math.floor(GAME.elixir.P1);
  
  const p2Val = document.getElementById('p2Elixir');
  if (p2Val) p2Val.textContent = Math.floor(GAME.elixir.P2);
  
  const unitCount = document.getElementById('unitCount');
  if (unitCount) unitCount.textContent = GAME.units.length;
}

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color('#80ccff');
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 500);
  camera.position.set(12, 14, 20);
  camera.lookAt(0, 0, 0);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  
  const ground = new THREE.Mesh(new THREE.BoxGeometry(ARENA.width, 0.2, ARENA.height), new THREE.MeshStandardMaterial({ color: 0x153047 }));
  ground.position.y = -0.1;
  scene.add(ground);
  
  const hemi = new THREE.HemisphereLight(0xffffff, 0x333344, 0.7);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(10,18,8);
  scene.add(dir);
  
  setupArena();
}

function startGame() {
  if (STATE.started) return;
  STATE.started = true;
  initThree();
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if (STATE.started && !STATE.gameOver) {
    tickElixir(dt);
    tickUnits(dt);
    botProactive(dt);
    updateUI();
  }
  if (controls) controls.update();
  if (renderer && scene && camera) renderer.render(scene, camera);
  requestAnimationFrame(gameLoop);
}

window.selectMode = function(mode){ STATE.mode = mode; startGame(); };
window.startGame = startGame;

console.log('Game loaded!');
  </script>
</body>
</html>
